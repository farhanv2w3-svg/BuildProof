<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" fill="none" role="img" aria-label="BuildProof journey diagram">
  <defs>
    <linearGradient id="bp-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5dcd0"/>
      <stop offset="1" stop-color="#1a6b58"/>
    </linearGradient>
  </defs>

  <!-- connecting path -->
  <path d="M78 210 H 682" stroke="url(#bp-line)" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
  <!-- forward arrow -->
  <path d="M672 196 l18 14 -18 14" stroke="#1a6b58" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- node 1 -->
  <g>
    <circle cx="78" cy="210" r="34" fill="#ffffff" stroke="#e3e9e6" stroke-width="1.5"/>
    <circle cx="78" cy="210" r="26" fill="#f0f7f4"/>
    <rect x="66" y="216" width="10" height="10" rx="2" fill="#b5dcd0"/>
    <rect x="79" y="216" width="10" height="10" rx="2" fill="#7dc0ad"/>
    <path d="M66 204 l7 7 17 -17" stroke="#1a6b58" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="78" y="272" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="700" font-size="14" fill="#101d19">Real problem</text>
    <text x="78" y="291" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#5b6b66">Screened &amp; reviewed</text>
  </g>

  <!-- node 2 -->
  <g>
    <circle cx="234" cy="210" r="34" fill="#ffffff" stroke="#e3e9e6" stroke-width="1.5"/>
    <circle cx="234" cy="210" r="26" fill="#f0f7f4"/>
    <circle cx="225" cy="202" r="4" fill="#1a6b58"/>
    <circle cx="243" cy="202" r="4" fill="#7dc0ad"/>
    <circle cx="225" cy="220" r="4" fill="#7dc0ad"/>
    <circle cx="243" cy="220" r="4" fill="#1a6b58"/>
    <text x="234" y="272" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="700" font-size="14" fill="#101d19">Validation</text>
    <text x="234" y="291" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#5b6b66">Consented interviews</text>
  </g>

  <!-- node 3 -->
  <g>
    <circle cx="390" cy="210" r="34" fill="#ffffff" stroke="#e3e9e6" stroke-width="1.5"/>
    <circle cx="390" cy="210" r="26" fill="#f0f7f4"/>
    <path d="M378 222 v-14 h24 v14 z" fill="#b5dcd0"/>
    <rect x="384" y="192" width="12" height="10" rx="2" fill="#1a6b58"/>
    <text x="390" y="272" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="700" font-size="14" fill="#101d19">Practical test</text>
    <text x="390" y="291" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#5b6b66">Feasibility &amp; prototype</text>
  </g>

  <!-- node 4 -->
  <g>
    <circle cx="546" cy="210" r="34" fill="#ffffff" stroke="#e3e9e6" stroke-width="1.5"/>
    <circle cx="546" cy="210" r="26" fill="#f0f7f4"/>
    <rect x="528" y="200" width="12" height="22" rx="2" fill="#7dc0ad"/>
    <rect x="542" y="194" width="12" height="28" rx="2" fill="#1a6b58"/>
    <path d="M524 190 l8 8 26 -22" stroke="#d99033" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="546" y="272" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="700" font-size="14" fill="#101d19">Evidence</text>
    <text x="546" y="291" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#5b6b66">Reviewed, tiered</text>
  </g>

  <!-- node 5 -->
  <g>
    <circle cx="682" cy="210" r="34" fill="#1a6b58"/>
    <rect x="664" y="200" width="12" height="22" rx="2" fill="#ffffff" opacity="0.5"/>
    <rect x="678" y="194" width="12" height="28" rx="2" fill="#ffffff" opacity="0.75"/>
    <path d="M660 190 l9 9 28 -25" stroke="#f2b53c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="682" y="272" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="700" font-size="14" fill="#101d19">Opportunity</text>
    <text x="682" y="291" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#5b6b66">Proof Card &amp; next steps</text>
  </g>

  <!-- soft labels above -->
  <text x="78" y="118" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="10.5" fill="#175648" letter-spacing="1.5">SOLID</text>
  <text x="390" y="118" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="10.5" fill="#175648" letter-spacing="1.5">HONEST WORK</text>
  <text x="682" y="118" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="10.5" fill="#175648" letter-spacing="1.5">CREDIBILITY</text>

  <!-- stage numbers -->
  <text x="60" y="336" font-family="Manrope, sans-serif" font-weight="800" font-size="11" fill="#b5dcd0">01</text>
  <text x="216" y="336" font-family="Manrope, sans-serif" font-weight="800" font-size="11" fill="#b5dcd0">02</text>
  <text x="372" y="336" font-family="Manrope, sans-serif" font-weight="800" font-size="11" fill="#b5dcd0">03</text>
  <text x="528" y="336" font-family="Manrope, sans-serif" font-weight="800" font-size="11" fill="#b5dcd0">04</text>
  <text x="664" y="336" font-family="Manrope, sans-serif" font-weight="800" font-size="11" fill="#b5dcd0">05</text>
</svg>
